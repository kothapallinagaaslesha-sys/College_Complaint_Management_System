<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Submit Complaint</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="hero">

    <div class="glass-card">

        <h1>Submit Complaint</h1>

        {% if error %}

        <p style="color:red;">
            {{ error }}
        </p>

        {% endif %}

        <form method="POST"
              action="{{ url_for('submit_complaint') }}">

            <input
                type="text"
                name="title"
                placeholder="Complaint Title"
                required
            >

            <select name="category" required>

                <option value="">
                    Select Category
                </option>

                <option value="Academic">
                    Academic
                </option>

                <option value="Hostel">
                    Hostel
                </option>

                <option value="Library">
                    Library
                </option>

                <option value="Infrastructure">
                    Infrastructure
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

            <textarea
                name="description"
                placeholder="Complaint Description"
                rows="6"
                required
            ></textarea>

            <button type="submit">
                Submit Complaint
            </button>

        </form>

        <br>

        <a href="{{ url_for('student_dashboard') }}">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>

</html>
