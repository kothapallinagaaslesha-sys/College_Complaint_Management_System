<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            🎓
        </div>

        <h1>Create Student Account</h1>

        <p class="auth-subtitle">
            Register to submit and track college complaints
        </p>

        <form method="POST"
              action="{{ url_for('register') }}">

            <!-- STUDENT NAME -->
            <div class="form-group">

                <label for="name">
                    Student Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- CLASS -->
            <div class="form-group">

                <label for="class_name">
                    Class
                </label>

                <input
                    type="text"
                    id="class_name"
                    name="class_name"
                    placeholder="Example: B.Tech CSE"
                    required
                >

            </div>


            <!-- ROLL NUMBER -->
            <div class="form-group">

                <label for="roll_number">
                    Roll Number
                </label>

                <input
                    type="text"
                    id="roll_number"
                    name="roll_number"
                    placeholder="Enter your roll number"
                    required
                >

            </div>


            <!-- PASSWORD -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <!-- SUBMIT -->
            <button type="submit"
                    class="auth-btn">
                Create Account
            </button>

        </form>


        <!-- LOGIN LINK -->
        <div class="auth-footer">

            Already have an account?

            <a href="{{ url_for('student_login') }}">
                Student Login
            </a>

        </div>


        <!-- HOME LINK -->
        <div class="back-home">

            <a href="{{ url_for('home') }}">
                ← Back to Home
            </a>

        </div>

    </div>

</div>

</body>
</html>
