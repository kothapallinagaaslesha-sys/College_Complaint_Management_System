<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="hero">

    <div class="glass-card">

        <div class="logo">🎓</div>

        <h1>Student Login</h1>

        <p>
            Login to manage your complaints
        </p>

        {% if error %}

        <p style="color:red;">
            {{ error }}
        </p>

        {% endif %}

        <form method="POST"
              action="{{ url_for('student_login') }}">

            <input
                type="email"
                name="email"
                placeholder="Student Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">Student Login</button>
            </button>

        </form>

        <p>

            New Student?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </p>

        <p>

            <a href="{{ url_for('home') }}">
                ← Back to Home
            </a>

        </p>

    </div>

</div>

</body>

</html>
